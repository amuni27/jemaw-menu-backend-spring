# AGF-S1-02: dependency vulnerability monitoring. Alerts only: version-update PRs are disabled
# (open-pull-requests-limit: 0). Dependabot alerts / security updates are enabled in repository settings.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
