server:
  port: ${PORT:8080}
  # AGF-S1-19: behind Render's proxy the client IP comes from X-Forwarded-For. "native" makes Tomcat trust that
  # header only when the immediate peer is an internal proxy, so per-IP rate limits see the real client.
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&channelBinding=disable
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # AGF-S1-16: never log SQL in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  # Decision A covers development and test databases only. Production behaviour is unchanged (no production deployment
  # exists yet); switching production to Flyway + validate is part of S1-08B's production scope.
  flyway:
    enabled: false



# AGF-S1-16 / PO-3: no API documentation in production (development keeps Swagger)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Only health and info are exposed; info carries no custom properties
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiresMinutes: ${APP_JWT_EXPIRESMINUTES:120}


# cloudflare.* is defined in application.yml and supplied via CLOUDFLARE_R2_* environment variables.
