server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&channelBinding=disable
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # AGF-S1-16: never log SQL in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false



# AGF-S1-16 / PO-3: no API documentation in production (development keeps Swagger)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Only health and info are exposed; info carries no custom properties
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiresMinutes: ${APP_JWT_EXPIRESMINUTES:120}


# cloudflare.* is defined in application.yml and supplied via CLOUDFLARE_R2_* environment variables.
