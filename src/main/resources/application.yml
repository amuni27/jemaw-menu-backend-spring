spring:
  application:
    name: agafari-menu-backend
  config:
    # Optional, untracked local overrides (see application-local.example.yml)
    import: "optional:file:./application-local.yml"


  datasource:
    url: jdbc:postgresql://localhost:5432/agafari_menu
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Decision A: Flyway builds the schema (db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    # Decision A. Fresh databases run V1. An existing development database (built earlier by ddl-auto) is recorded at
    # version 1 without running V1, so its data stays; FlywayBaselineGuard refuses non-Agafari databases.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Existing database recorded at the provisional baseline"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

server:
  port: 8080

app:
  jwt:
    # Supplied at runtime via APP_JWT_SECRET; must be at least 32 characters (HS256)
    secret: ${APP_JWT_SECRET}
    expiresMinutes: 120
  baseDomain: ${APP_BASE_DOMAIN:agafarimenu.com}
  # AGF-S1-19: authentication rate limits (in memory, per application instance)
  # AGF-S2-13A password reset. The secret is dedicated (not the JWT secret) and at least 32 characters; without a
  # valid one, reset is off: requests get the usual answer and nothing is sent. Links point at the frontend reset page
  # and carry the token in the URL fragment. No email is sent until a provider is chosen (D5).
  password-reset:
    secret: ${APP_PASSWORD_RESET_SECRET:}
    link-base-url: ${APP_PASSWORD_RESET_LINK_BASE_URL:}
    token-ttl: 30m
  # AGF E4-M1: Super Admin. Admin tokens are short-lived. The first admin is created at startup only where a local/test
  # profile turns the authorization flag on (never here or in prod) and both APP_ADMIN_BOOTSTRAP_* variables are set.
  admin:
    jwt-expires-minutes: 30
    bootstrap:
      environment-authorized: false
      email: ${APP_ADMIN_BOOTSTRAP_EMAIL:}
      password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:}
  # AGF-S2-22: email verification. Links work once a secret, a link address and a provider-backed mailer (D5) exist.
  # The publish gate also needs the explicit flag (default off): configuring a provider or secret never enables it.
  email-verification:
    secret: ${APP_EMAIL_VERIFICATION_SECRET:}
    link-base-url: ${APP_EMAIL_VERIFICATION_LINK_BASE_URL:}
    token-ttl: 24h
    enforce-publish-gate: ${APP_EMAIL_VERIFICATION_ENFORCE:false}
  # AGF-S2-21: guest menu base URL for share-page redirects (same value as the frontend VITE_PUBLIC_MENU_BASE_URL).
  # Empty = the existing production frontend (PublicMenuBaseUrl.FALLBACK). Never hard-code a brand domain (D2).
  public-menu-base-url: ${APP_PUBLIC_MENU_BASE_URL:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-per-email:            # failed logins for one email
      limit: 5
      window: 15m
    login-per-ip:               # failed logins from one client IP (any email)
      limit: 20
      window: 15m
    register-per-ip:            # registration attempts from one client IP
      limit: 10
      window: 1h
    change-password-per-ip:     # change-password attempts from one client IP
      limit: 10
      window: 15m
    forgot-password-per-email:  # reset-link requests for one email (AGF-S2-13A)
      limit: 3
      window: 1h
    forgot-password-per-ip:     # reset-link requests from one client IP
      limit: 10
      window: 1h
    reset-password-per-ip:      # reset submissions from one client IP
      limit: 10
      window: 15m
    verify-email-resend-per-user: # verification links resent to one owner (AGF-S2-22; successful sends only)
      limit: 3
      window: 1h
    verify-email-resend-per-ip:   # resend attempts from one client IP
      limit: 10
      window: 1h
    verify-email-per-ip:          # verification-link submissions from one client IP
      limit: 10
      window: 15m
    max-tracked-keys: 100000    # memory bound for the counters


# All Cloudflare R2 values are supplied at runtime. No defaults: startup fails if any is missing.
cloudflare:
  accessKey: ${CLOUDFLARE_R2_ACCESS_KEY}
  secretKey: ${CLOUDFLARE_R2_SECRET_KEY}
  bucket: ${CLOUDFLARE_R2_BUCKET}
  endpoint: ${CLOUDFLARE_R2_ENDPOINT}
  publicBaseUrl: ${CLOUDFLARE_R2_PUBLIC_BASE_URL}
