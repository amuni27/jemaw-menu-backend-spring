# Test profile (AGF-S1-03). Dummy values only: no real credentials, no network access.
spring:
  datasource:
    # Used only with AGAFARI_TEST_EXTERNAL_DB=true; otherwise Testcontainers supplies the connection
    url: ${AGAFARI_TEST_DB_URL:jdbc:postgresql://localhost:5432/agafari_test}
    username: ${AGAFARI_TEST_DB_USERNAME:postgres}
    password: ${AGAFARI_TEST_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Decision A: the schema comes from Flyway (db/migration); Hibernate only validates it
      ddl-auto: validate
  flyway:
    # Always on in tests, also for contexts that add the prod profile (ProductionProfileTest: "prod", "test"), whose
    # own fresh Testcontainers database must still be built from the migrations. Production itself keeps Flyway off.
    enabled: true
    # test databases start empty (Testcontainers); never baseline an unknown non-empty schema here
    baseline-on-migrate: false

app:
  jwt:
    secret: test-only-jwt-secret-not-used-anywhere-else-0123456789
  password-reset:
    secret: test-only-password-reset-secret-not-the-jwt-one-42
    link-base-url: http://frontend.test.invalid/auth/reset-password
  email-verification: # AGF-S2-22
    secret: test-only-email-verification-secret-distinct-77
    link-base-url: http://frontend.test.invalid/auth/verify-email
  # AGF-S2-21: share page redirect target
  public-menu-base-url: https://frontend.test.invalid

cloudflare:
  accessKey: test-access-key
  secretKey: test-secret-key
  bucket: test-bucket
  endpoint: https://r2.test.invalid
  publicBaseUrl: https://images.test.invalid
